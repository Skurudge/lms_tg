name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "develop_2" ]
  pull_request:
    branches: [ "main", "develop", "develop_2" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # --- ЭТАП 1: АВТОМАТИЧЕСКОЕ ТЕСТИРОВАНИЕ ПРОЕКТА ---
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Настройка Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установка Poetry напрямую через pip
        run: |
          pip install poetry
          poetry config virtualenvs.create false

      - name: Установка зависимостей проекта
        run: poetry install --no-root

      - name: Запуск автотестов Django
        run: |
          export SECRET_KEY="ci-cd-test-secret-key-placeholder"
          export DEBUG=True
          export DB_ENGINE="django.db.backends.sqlite3"
          poetry run python manage.py test

  # --- ЭТАП 2: ЛИНТИНГ И ПРОВЕРКА PEP 8 ---
  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Установка линтеров
        run: pip install flake8

      - name: Проверка стиля кода через Flake8 (Критерий оценки)
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,migrations,.venv,config/celery.py

  # --- ПРОВЕРКА СБОРКИ DOCKER-ОБРАЗОВ (Критерий курсовой) ---
  build_check:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Проверка исходного кода
        uses: actions/checkout@v4

      - name: Тестовая сборка Docker-образов
        run: docker compose build

  # --- ЭТАП 4: АВТОМАТИЧЕСКИЙ ДЕПЛОЙ НА УДАЛЕННЫЙ СЕРВЕР ЧЕРЕЗ DOCKER ---
  deploy:
    runs-on: ubuntu-latest
    needs: build_check
    if: github.event_name == 'push'
    steps:
      - name: Шаг 1. Чистка старого мусора на удаленном сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /app/lms_project 2>/dev/null && docker compose down -v || true
            rm -rf /app/lms_project/*
            mkdir -p /app/lms_project

      - name: Шаг 2. Копирование свежих файлов проекта на удаленный сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "."
          target: "/app/lms_project"

      - name: Шаг 3. Подключение по SSH, создание env-файла и запуск Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /app/lms_project
            
            echo "DB_NAME=${{ secrets.DB_NAME }}" > .env
            echo "DB_USER=${{ secrets.DB_USER }}" >> .env
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
            
            # Теперь файл физически на месте, и sed отработает без ошибок
            sed -i 's/"8080:80"/"80:80"/g' docker-compose.yml
            
            docker builder prune -f
            
            docker compose up --build -d
            docker compose exec -T web python manage.py migrate
